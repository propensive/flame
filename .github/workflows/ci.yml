name: CI

# Build and test on every merge into main, via the shared Soundness-application workflow —
# see propensive/.github for what it does and what it expects of this repository (the ./mill
# wrapper, and the version pins in build.mill). The launcher resolves flame-core, flame-web and
# flame-client as published coordinates, so all three are published locally first (Mill's
# brace expansion names them as one target).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      compile:       flame.{core,web,client}.compile
      publish_local: flame.{core,web,client}
      assembly:      flame.launcher.assembly
      test_assembly: flame.test.assembly
      test_main:     flame.Tests
